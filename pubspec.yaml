name: julpiypay
description: "Julpiypay — Your money, clearly managed."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Preferences
  shared_preferences: ^2.2.3

  # Formatting
  intl: ^0.19.0

  # Icons
  lucide_icons_flutter: ^3.0.5

  # Charts
  fl_chart: ^0.68.0

  # Typography
  google_fonts: ^6.2.1

  # Swipe actions
  flutter_slidable: ^3.1.1

  # Export / import
  csv: ^6.0.0
  file_picker: ^8.0.5
  share_plus: ^9.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
